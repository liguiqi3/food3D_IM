name: MegaLinter

# This workflow is called by ci-orchestrator.yml when the :shield: gitmoji
# is present in commit messages.
#
# NOTE: The fcpp-dev branch has this workflow in debugging mode (triggers on
# push to fcpp-dev only). In the ci-orchestrator system, this workflow is
# triggered via workflow_call, and the gitmoji trigger logic is centralized
# in the metadata-controller.

on:
  workflow_call:
    inputs:
      validate_all_codebase:
        description: 'Whether to validate all source code or just the diff'
        required: false
        type: string
        default: 'false'

env:
  # Strict gate mode: never auto-fix in CI, lint failures fail the job.
  APPLY_FIXES: none

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-security
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          # Derive system packages from conandata.yml requirements so the gate
          # follows dependency changes. When adding a new C/C++ dep whose headers
          # appear in src/, extend the mapping below (see het-deps N1). Unknown
          # deps are ignored here and surface as clang-tidy include errors.
          DEPS=$(python3 - <<'PY'
          import yaml
          reqs = yaml.safe_load(open('conandata.yml'))['requirements']
          mapping = {'eigen': 'libeigen3-dev', 'pcl': 'libpcl-dev', 'nlohmann_json': 'nlohmann-json3-dev'}
          pkgs = {mapping[r.split('/')[0]] for r in reqs if r.split('/')[0] in mapping}
          print(' '.join(sorted(pkgs)))
          PY
          )
          sudo apt-get install -y clang-tidy $DEPS
          # apt clang-format (v18 on noble) does NOT support the `Language: C`
          # config section (needs LLVM >= 19) — pin the pip build instead.
          python3 -m pip install --only-binary :all: clang-format==23.1.0

      # Required gate: formatting must be clean.
      # Private convention routes by language family: .c/.h -> C, .cpp/.hpp -> C++
      # (clang-format's built-in extension map treats .h as C++, so we route
      #  .h explicitly to the C config — see .github/skills/_shared/code-conventions.md)
      - name: clang-format gate
        run: |
          find include src -type f \( -name '*.c' -o -name '*.h' \) \
            -exec clang-format --dry-run --Werror --style=file:.github/misc/.clang-format-c {} +
          find include src -type f \( -name '*.cpp' -o -name '*.hpp' \) \
            -exec clang-format --dry-run --Werror --style=file:.github/misc/.clang-format-cpp {} +

      # PCL is header-heavy and version-suffixed on Ubuntu; resolve its include
      # flags from pkg-config (versioned name first, then unversioned, then a
      # conservative default) so the C++ clang-tidy gate can find <pcl/...>.
      - name: Resolve PCL include flags
        run: |
          PCL_INC=$(pkg-config --cflags pcl_common-1.14 2>/dev/null || pkg-config --cflags pcl_common 2>/dev/null || echo "-I/usr/include/pcl-1.14")
          echo "PCL_INC=$PCL_INC" >> "$GITHUB_ENV"

      # Required gate: static analysis, warning = failure (WarningsAsErrors in .clang-tidy).
      # Third-party headers come from apt and are treated as system headers, so only
      # repo diagnostics count (HeaderFilterRegex anchored to ^(include|src)/).
      - name: clang-tidy gate
        run: |
          shopt -s nullglob
          for f in src/*.c; do
            clang-tidy --config-file=.github/misc/.clang-tidy "$f" -- -std=c11 -Iinclude -I/usr/include/eigen3
          done
          for f in src/*.cpp; do
            clang-tidy --config-file=.github/misc/.clang-tidy "$f" -- -std=c++17 -Iinclude -I/usr/include/eigen3 $PCL_INC
          done

      # Required gate: secrets scan with pinned binary version
      - name: gitleaks gate
        run: |
          curl --proto '=https' --proto-redir '=https' -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect -c .github/misc/.gitleaks.toml --no-banner

  megalinter:
    name: MegaLinter (advisory)
    runs-on: ubuntu-latest
    # The MegaLinter run is advisory (see F7). It only needs to read the repo
    # and upload its report artifact; it does NOT need to write back to GitHub.
    # Keeping this read-only also lets the ci-orchestrator call this reusable
    # workflow with a read-only token (GitHub caps reusable-workflow perms by
    # the caller, and a write job here would force the caller into write-all).
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check Grafana API reporter secrets
        id: check_grafana
        run: |
          if [[ -n "$API_URL" && -n "$API_USER" && -n "$API_PASS" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Grafana API reporter secrets are configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Grafana API reporter secrets not configured — will fallback to artifact upload"
          fi
        env:
          API_URL: ${{ secrets.API_REPORTER_URL }}
          API_USER: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_PASS: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}

      # Run MegaLinter WITH Grafana API reporter when secrets are available
      # [advisory] semgrep/checkov/devskim run inside MegaLinter cannot be made
      # deterministic without runner log access (see REMEDIATION-PLAN.md F7);
      # the REQUIRED gates are the native quality-gates job above.
      - name: MegaLinter (with Grafana reporter)
        if: steps.check_grafana.outputs.available == 'true'
        # Pinned to MegaLinter v8.8.0 — keep in sync with `--release` in
        # .github/misc/run-megalinter.sh so local runs match CI exactly.
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        continue-on-error: false
        id: ml_grafana
        env:
          MEGALINTER_CONFIG: .github/misc/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_REPORTER: true
          API_REPORTER_URL: ${{ secrets.API_REPORTER_URL }}
          API_REPORTER_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_BASIC_AUTH_USERNAME }}
          API_REPORTER_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_BASIC_AUTH_PASSWORD }}
          API_REPORTER_METRICS_URL: ${{ secrets.API_REPORTER_METRICS_URL }}
          API_REPORTER_METRICS_BASIC_AUTH_USERNAME: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_USERNAME }}
          API_REPORTER_METRICS_BASIC_AUTH_PASSWORD: ${{ secrets.API_REPORTER_METRICS_BASIC_AUTH_PASSWORD }}
          API_REPORTER_DEBUG: false

      # Run MegaLinter WITHOUT Grafana API reporter as fallback
      - name: MegaLinter (artifact-only)
        if: steps.check_grafana.outputs.available != 'true'
        # Pinned to MegaLinter v8.8.0 (same as the Grafana path above).
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        continue-on-error: false
        id: ml_fallback
        env:
          MEGALINTER_CONFIG: .github/misc/.mega-linter.yml
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always upload artifacts as a safety net (works for both paths)
      - name: Archive production artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: MegaLinter reports
          include-hidden-files: "true"
          path: |
            megalinter-reports
            mega-linter.log
